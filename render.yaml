services:
  - type: web
    name: leadrouter
    env: node
    plan: starter
    nodeVersion: 18
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      # Frontend API URL - empty string means use relative paths (same origin)
      - key: REACT_APP_API_URL
        value: ""
      # Database configuration - using MongoDB Atlas (recommended)
      # Option 1: Use MongoDB Atlas (recommended)
      # Set MONGODB_URI in Render dashboard:
      # Go to: Service → Environment → Add Environment Variable
      # Key: MONGODB_URI
      # Value: mongodb+srv://username:password@cluster.mongodb.net/leadrouter?appName=leadrouter
      - key: MONGODB_URI
        sync: false
      # Option 2: Use Render MongoDB (if available)
      # Link database in Render dashboard (if MongoDB service exists)
      # This automatically adds MONGODB_URI environment variable
    healthCheckPath: /health

# MongoDB Configuration
# For production, use MongoDB Atlas (recommended):
# 1. Create free cluster at: https://www.mongodb.com/cloud/atlas
# 2. Get connection string: mongodb+srv://username:password@cluster.mongodb.net/leadrouter
# 3. Add MONGODB_URI to Render environment variables
# 4. Whitelist Render IP addresses in MongoDB Atlas Network Access
