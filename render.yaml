services:
  - type: web
    name: leadrouter
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      # Frontend API URL - empty string means use relative paths (same origin)
      - key: REACT_APP_API_URL
        value: ""
      # Database configuration - using your own PostgreSQL
      # IMPORTANT: Replace localhost with your PostgreSQL server's public IP or hostname
      - key: DB_HOST
        sync: false  # You'll set this manually in Render dashboard
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "leadrouter"
      - key: DB_USER
        sync: false  # You'll set this manually in Render dashboard
      - key: DB_PASSWORD
        sync: false  # You'll set this manually in Render dashboard (mark as secret!)
    healthCheckPath: /health

# No Render database - using your own PostgreSQL server
