services:
  - type: web
    name: leadrouter
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      # Frontend API URL - empty string means use relative paths (same origin)
      - key: REACT_APP_API_URL
        value: ""
      # Database configuration - using Render PostgreSQL
      # Option 1: Link database in Render dashboard (recommended)
      # Go to: Service → Settings → Databases → Link Database
      # This automatically adds DATABASE_URL environment variable
      # Option 2: Use fromDatabase syntax below (if database name is 'leadrouter-db')
      - key: DATABASE_URL
        fromDatabase:
          name: leadrouter-db
          property: connectionString
    healthCheckPath: /health

# Render PostgreSQL Database
# Create a PostgreSQL database in Render Dashboard:
# 1. Go to Dashboard → New → PostgreSQL
# 2. Name it: leadrouter-db
# 3. Link it to your web service (auto-adds DATABASE_URL)
# OR manually add DATABASE_URL from database's Internal Database URL
