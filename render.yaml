services:
  - type: web
    name: leadrouter
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /health

databases:
  - name: leadrouter-db
    plan: starter
    databaseName: leadrouter
    user: leadrouter_user
