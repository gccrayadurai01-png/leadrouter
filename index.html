<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Round Robin System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }

        .control-group h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .rep-card {
            border-left: 4px solid #667eea;
        }

        .lead-card {
            border-left: 4px solid #28a745;
        }

        .assignment-card {
            border-left: 4px solid #ffc107;
            background: #fffbf0;
        }

        .conversation-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }

        .log-success {
            border-left-color: #28a745;
        }

        .log-info {
            border-left-color: #17a2b8;
        }

        .log-warning {
            border-left-color: #ffc107;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .highlight {
            background: #fff3cd;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Lead Round Robin System</h1>
            <p>Conversation-Based Lead Assignment</p>
        </div>

        <div class="content">
            <!-- Controls Section -->
            <div class="section">
                <h2 class="section-title">Controls</h2>
                <div class="controls">
                    <div class="control-group">
                        <h3>Register Sales Rep</h3>
                        <div class="form-group">
                            <label>Rep ID</label>
                            <input type="text" id="repId" placeholder="e.g., rep1">
                        </div>
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="repName" placeholder="e.g., John Doe">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="repEmail" placeholder="e.g., john@example.com">
                        </div>
                        <button onclick="registerRep()">Register Rep</button>
                    </div>

                    <div class="control-group">
                        <h3>Register Lead</h3>
                        <div class="form-group">
                            <label>Lead ID</label>
                            <input type="text" id="leadId" placeholder="e.g., lead1">
                        </div>
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" id="leadName" placeholder="e.g., Acme Corp">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="leadEmail" placeholder="e.g., contact@acme.com">
                        </div>
                        <button onclick="registerLead()">Register Lead</button>
                    </div>

                    <div class="control-group">
                        <h3>Record Conversation</h3>
                        <div class="form-group">
                            <label>Lead ID</label>
                            <select id="conversationLeadId"></select>
                        </div>
                        <div class="form-group">
                            <label>Rep ID</label>
                            <select id="conversationRepId"></select>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="conversationType">
                                <option value="phone">Phone</option>
                                <option value="email">Email</option>
                                <option value="meeting">Meeting</option>
                                <option value="chat">Chat</option>
                            </select>
                        </div>
                        <button onclick="recordConversation()">Record Conversation</button>
                    </div>

                    <div class="control-group">
                        <h3>Assign Lead</h3>
                        <div class="form-group">
                            <label>Lead ID</label>
                            <select id="assignLeadId"></select>
                        </div>
                        <button onclick="assignLead()">Assign Lead</button>
                        <button onclick="assignAllLeads()" style="background: #28a745; margin-top: 10px;">Assign All Leads</button>
                    </div>
                </div>
            </div>

            <!-- Statistics Section -->
            <div class="section">
                <h2 class="section-title">Statistics</h2>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <!-- Reps Section -->
            <div class="section">
                <h2 class="section-title">Sales Representatives</h2>
                <div class="grid" id="repsGrid">
                    <div class="empty-state">No reps registered yet</div>
                </div>
            </div>

            <!-- Leads Section -->
            <div class="section">
                <h2 class="section-title">Leads</h2>
                <div class="grid" id="leadsGrid">
                    <div class="empty-state">No leads registered yet</div>
                </div>
            </div>

            <!-- Assignments Section -->
            <div class="section">
                <h2 class="section-title">Recent Assignments</h2>
                <div class="grid" id="assignmentsGrid">
                    <div class="empty-state">No assignments yet</div>
                </div>
            </div>

            <!-- Activity Log -->
            <div class="section">
                <h2 class="section-title">Activity Log</h2>
                <div class="log" id="activityLog"></div>
            </div>
        </div>
    </div>

    <script src="lead-round-robin-browser.js"></script>
    <script src="app.js"></script>
</body>
</html>
